name: Build macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Build Rust binaries
        run: cargo build --locked --release -p lcu-cli -p lcu-desktop

      - name: Build macOS service
        run: swift build -c release --package-path native/macos-window-service

      - name: Package
        run: bash scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AnythingUse-macOS-arm64-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
